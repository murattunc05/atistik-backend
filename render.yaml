services:
  - type: web
    name: atistik-api
    runtime: python
    buildCommand: apt-get update && apt-get install -y libgomp1 && pip install -r requirements.txt
    startCommand: gunicorn api_server:app --bind 0.0.0.0:$PORT --timeout 240
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: ATISTIK_RESTORE_TOKEN_SHA256
        value: a74dbe069f765fda3e15b635291507b6aacedd9ac2610630768910d6c6a652da
    plan: free
    healthCheckPath: /health
